<!DOCTYPE html>
<html lang="en" data-theme="dark" class="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No remote origins are permitted: the app must work with no network. -->
<!-- The policy exists to enforce the offline guarantee: `default-src 'self'`
     and `connect-src 'self'` mean the page cannot reach any remote origin,
     which is the property that matters here.

     `unsafe-eval` is required because pywebview installs its native bridge
     by evaluating a string in the page; without it `window.pywebview.api`
     never appears and the native dialogs stop working. Every script is
     served by this process, so nothing third-party can exploit it.

     `__CSP_NONCE__` is replaced per response so the inlined first-screen
     data may run. It stays a literal if the file is opened directly, in
     which case there is no inline script either. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'nonce-__CSP_NONCE__';
               style-src 'self' 'unsafe-inline'; img-src 'self' data:;
               font-src 'self'; connect-src 'self'; base-uri 'none';
               object-src 'none'; frame-src 'none'">
<title>Agentboard</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="app">

  <header class="titlebar">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="21" rx="5.5"
              stroke="currentColor" stroke-width="1.6" opacity=".35"/>
        <path d="M6 7l3.2 3.2L6 13.4" stroke="var(--accent)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.4 13.4h5.2" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" opacity=".5"/>
        <rect x="6"    y="16.4" width="2.4" height="2.2" rx="1" fill="currentColor" opacity=".75"/>
        <rect x="9.9"  y="14.6" width="2.4" height="4"   rx="1" fill="currentColor" opacity=".75"/>
        <rect x="13.8" y="15.4" width="2.4" height="3.2" rx="1" fill="currentColor" opacity=".75"/>
        <rect x="17.7" y="13.4" width="2.4" height="5.2" rx="1" fill="var(--accent)"/>
      </svg>
      <span class="brand-name">Agentboard</span>
    </span>

    <nav class="nav" id="nav">
      <button data-view="sessions" class="active">Sessions</button>
      <button data-view="usage">Usage</button>
      <button data-view="config">Settings</button>
    </nav>

    <span class="spacer"></span>

    <div class="search-wrap">
      <span class="icon">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <input id="search" type="search" placeholder="Search all conversations"
             autocomplete="off" spellcheck="false" aria-label="Search all conversations">
      <kbd>/</kbd>
    </div>

    <span class="spacer"></span>

    <!-- The agent picker: scopes every view to one agent, or shows all. -->
    <div class="agent-picker" id="provider-switch"></div>

    <!-- Everything used now and then lives in one quiet menu. -->
    <div class="popover-host">
      <button id="btn-menu" class="icon-button" type="button" aria-haspopup="menu"
              aria-expanded="false" aria-controls="app-menu" aria-label="More" title="More">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="3.5" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="12.5" cy="8" r="1.4" fill="currentColor"/>
        </svg>
      </button>
      <div class="popover menu align-right" id="app-menu" role="menu" hidden>
        <button id="btn-refresh" role="menuitem" type="button" title="Rebuild the index">
          <span>Refresh</span><kbd>F5</kbd>
        </button>
        <button id="btn-theme" role="menuitem" type="button" title="Cycle system, light and dark">
          <span>Theme</span><span class="menu-value" id="theme-value">System</span>
        </button>
        <div class="menu-sep" role="separator"></div>
        <button id="btn-maintenance" role="menuitem" type="button" title="Bulk clean-up rules">
          <span>Clean up sessions…</span>
        </button>
        <button id="btn-trash" role="menuitem" type="button" title="Show the trash">
          <span>Trash</span>
        </button>
        <div class="menu-sep" role="separator"></div>
        <button id="btn-shortcuts" role="menuitem" type="button">
          <span>Keyboard shortcuts</span><kbd>?</kbd>
        </button>
      </div>
    </div>
  </header>

  <div class="progress-bar" id="progress"><div></div></div>

  <main>
    <!-- Sessions ------------------------------------------------------- -->
    <section class="view active" id="view-sessions">
      <aside class="sidebar">
        <div class="sidebar-head">
          <select id="filter-project" class="quiet-select" aria-label="Filter by project">
            <option value="">All projects</option>
          </select>
          <div class="popover-host">
            <button id="btn-filters" class="icon-button" type="button" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="filter-panel"
                    aria-label="Sort and filter" title="Sort and filter">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2.5 4.5h11M4.5 8h7M6.5 11.5h3" stroke="currentColor"
                      stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="filter-dot" id="filter-dot" hidden></span>
            </button>
            <div class="popover align-right filter-panel" id="filter-panel" role="dialog"
                 aria-label="Sort and filter" hidden>
              <label class="field">
                <span>Sort by</span>
                <select id="sort" aria-label="Sort sessions">
                  <option value="recent">Most recent</option>
                  <option value="oldest">Oldest first</option>
                  <option value="longest">Longest</option>
                  <option value="expensive">Costliest</option>
                  <option value="messages">Most messages</option>
                  <option value="tokens">Most tokens</option>
                  <option value="size">Largest file</option>
                  <option value="title">A to Z</option>
                </select>
              </label>
              <label class="field">
                <span>Model</span>
                <select id="filter-model" aria-label="Filter by model">
                  <option value="">Any model</option>
                </select>
              </label>
              <label class="field">
                <span>Tool used</span>
                <select id="filter-tool" aria-label="Filter by tool">
                  <option value="">Any tool</option>
                </select>
              </label>
              <button id="btn-favorites" class="toggle-row" type="button" aria-pressed="false">
                <span class="star-glyph" aria-hidden="true">&#9733;</span>
                <span>Favourites only</span>
              </button>
              <button id="btn-clear-filters" class="link-button" type="button">Reset</button>
            </div>
          </div>
        </div>

        <div class="sidebar-meta">
          <span id="list-count">&nbsp;</span>
          <span class="spacer" style="flex:1"></span>
          <span id="list-hint" class="faint"></span>
        </div>

        <div class="selection-bar hidden" id="selection-bar">
          <span id="selection-count" class="num"></span>
          <span class="spacer" style="flex:1"></span>
          <button id="btn-select-all" title="Select every listed session">All</button>
          <button id="btn-select-none" title="Clear the selection">None</button>
          <button id="btn-delete-selected" class="danger"
                  title="Move the selected sessions to the trash">Move to trash</button>
        </div>

        <div class="session-list" id="session-list" tabindex="0"></div>
      </aside>

      <div class="content" id="session-content">
        <div class="placeholder welcome" id="sessions-placeholder">
          <div class="welcome-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="6" y="10" width="30" height="20" rx="8" fill="var(--accent-soft)"/>
              <rect x="14" y="20" width="28" height="18" rx="8" fill="var(--user-soft)"
                    stroke="var(--accent)" stroke-opacity=".35"/>
              <circle cx="22" cy="29" r="1.6" fill="var(--accent)"/>
              <circle cx="28" cy="29" r="1.6" fill="var(--accent)" opacity=".7"/>
              <circle cx="34" cy="29" r="1.6" fill="var(--accent)" opacity=".4"/>
            </svg>
          </div>
          <h2 id="welcome-title">Welcome back</h2>
          <p>Pick a conversation to read it again, or press <kbd>/</kbd> to search them all.</p>
          <div class="welcome-recent" id="welcome-recent"></div>
          <p class="welcome-hint">Press <kbd>?</kbd> for keyboard shortcuts</p>
        </div>
      </div>
    </section>

    <!-- Usage ---------------------------------------------------------- -->
    <section class="view" id="view-usage">
      <div class="content" id="usage-host"></div>
    </section>

    <!-- Config --------------------------------------------------------- -->
    <section class="view" id="view-config">
      <div class="content" id="config-host"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">Starting</span>
    <span class="spacer"></span>
    <span id="status-corpus" class="num"></span>
    <span id="status-native" class="faint"></span>
  </footer>

</div>

<div id="toasts" role="status" aria-live="polite"></div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header>
      <span id="modal-title">Keyboard shortcuts</span>
      <span class="spacer"></span>
      <button id="modal-close" aria-label="Close">&#x2715;</button>
    </header>
    <div class="content-area" id="modal-body"></div>
  </div>
</div>

<script src="/static/markdown.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/usage.js"></script>
<script src="/static/config-view.js"></script>
<script src="/static/viewer.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
